# Daily prospective archive (code: CIRCEO-Energy/circeo-meteo). Re-checks the last 3 days and adds
# what is missing: ECMWF HRES / AIFS / WAM waves and GEFS control (monthly files, merged), ECMWF ENS
# and GEFS ensemble (one file per day), GFS-Wave (monthly); plus, if the Copernicus Marine secrets
# are set, today's 10-day hourly ocean forecast (currents, temperature).
name: daily
on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:
    inputs:
      lookback: {description: 'days to re-check (max ~30)', default: '3'}
permissions:
  contents: write
concurrency: {group: daily-archive, cancel-in-progress: false}
jobs:
  aggregate:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env: {GH_TOKEN: '${{ github.token }}', REPO: '${{ github.repository }}'}
    steps:
      - uses: actions/checkout@v4
        with: {repository: CIRCEO-Energy/circeo-meteo}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip}
      - run: pip install -r requirements.txt
      - name: list existing assets and download the current monthly files
        run: |
          mkdir -p monthly
          gh api "repos/$REPO/releases?per_page=100" --paginate --jq '.[].assets[].name' > assets.txt || touch assets.txt
          for M in $(date -u -d '-30 days' +%Y%m) $(date -u +%Y%m); do
            for f in $(grep -E "_${M}\.nc$" assets.txt); do
              TAG=$(python3 -c "from meteo.common import release_for; print(release_for('$f'))")
              gh release download "$TAG" -R "$REPO" -p "$f" -D monthly --skip-existing || true
            done
          done
          ls -la monthly
      - name: fetch missing days
        run: python -m meteo.aggregate --dir monthly --existing assets.txt --lookback ${{ inputs.lookback || '3' }}
      - name: upload
        run: |
          [ -s monthly/touched.txt ] && python -m meteo.publish --repo "$REPO" $(cat monthly/touched.txt) || echo "nothing new"
      - name: Copernicus Marine forecast of the day
        if: ${{ env.CMEMS_USER != '' }}
        env:
          CMEMS_USER: ${{ secrets.COPERNICUSMARINE_SERVICE_USERNAME }}
          COPERNICUSMARINE_SERVICE_USERNAME: ${{ secrets.COPERNICUSMARINE_SERVICE_USERNAME }}
          COPERNICUSMARINE_SERVICE_PASSWORD: ${{ secrets.COPERNICUSMARINE_SERVICE_PASSWORD }}
        run: |
          python -m meteo.build cmems_phy_forecast --year $(date -u +%Y) --out cmems
          python -m meteo.publish --repo "$REPO" cmems/*
