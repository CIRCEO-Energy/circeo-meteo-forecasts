# Forecast-vs-ERA5 scores from the ARCHIVED forecast files (meteo/scores.py in circeo-meteo):
# no download from the forecast sources, only Release assets of this repo and of circeo-meteo.
# Kept up to date automatically: every day, each (product, month) whose forecast files are newer
# than its score file is (re)scored. Results: Release scores-v1 (scores_<prefix>_<YYYYMM>.nc).
name: scores
on:
  schedule: [{cron: '41 4 * * *'}]
  workflow_dispatch:
    inputs:
      max_parallel: {description: 'max concurrent jobs', default: '6'}
      code_ref: {description: 'branch / commit of circeo-meteo', default: 'main'}
      force_before: {description: 'rescore every score file older than this ISO time (scorer changes)', default: '2026-11-14T10:00:00Z'}
permissions:
  contents: write
concurrency: {group: scores, cancel-in-progress: false}
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs: {matrix: '${{ steps.m.outputs.matrix }}', n: '${{ steps.m.outputs.n }}'}
    env: {GH_TOKEN: '${{ github.token }}', FORCE_BEFORE: "${{ inputs.force_before || '2026-11-14T10:00:00Z' }}"}
    steps:
      - uses: actions/checkout@v4
      - id: m
        run: python3 .github/scripts/scores_plan.py >> "$GITHUB_OUTPUT"
  score:
    needs: plan
    if: needs.plan.outputs.n != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy: {fail-fast: false, max-parallel: 8, matrix: '${{ fromJSON(needs.plan.outputs.matrix) }}'}
    env: {GH_TOKEN: '${{ github.token }}'}
    steps:
      - uses: actions/checkout@v4
        with: {repository: CIRCEO-Energy/circeo-meteo, ref: "${{ inputs.code_ref || 'main' }}"}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip}
      - run: pip install -r requirements.txt
      - name: fetch forecasts, ERA5 (month + next), ocean mask
        run: |
          Y=${{ matrix.year }}; M=$(printf %02d ${{ matrix.month }})
          N=$(date -d "$Y-$M-01 +1 month" +%Y%m)
          python client/fetch_meteo.py --repo ${{ github.repository }} --release ${{ matrix.release }} --pattern "${{ matrix.prefix }}_$Y$M*.nc" --dest fc
          if [ '${{ matrix.kind }}' = wind ]; then T=era5-uv10-0p25-v2; P=era5_uv10_0p25; else T=era5-waves-0p5-v2; P=era5_waves_0p5; fi
          for ym in $Y$M $N; do python client/fetch_meteo.py --repo CIRCEO-Energy/circeo-meteo --release $T --pattern "${P}_$ym.nc" --dest era5 || true; done
          python client/fetch_meteo.py --repo CIRCEO-Energy/circeo-meteo --release era5-sst-0p25-v2 --pattern "era5_sst_0p25_$Y.nc" --dest sst
          echo "YM=$Y$M" >> "$GITHUB_ENV"
      - run: python -m meteo.scores --files fc/*/*.nc --era5 era5 --mask $(ls sst/*/*.nc) --out scores --name ${{ matrix.prefix }}_$YM
      - name: upload
        run: |
          gh release view scores-v1 -R ${{ github.repository }} >/dev/null 2>&1 || gh release create scores-v1 -R ${{ github.repository }} --title scores-v1 --notes "Monthly forecast-vs-ERA5 scores computed from the archived forecasts (meteo/scores.py in CIRCEO-Energy/circeo-meteo)."
          gh release upload scores-v1 scores/*.nc -R ${{ github.repository }} --clobber
