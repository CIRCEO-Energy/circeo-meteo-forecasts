# Backup mirror of every Release asset to a public Hugging Face dataset (meteo/mirror_hf.py).
# Needs: repository secret HF_TOKEN (Hugging Face token with write access) and repository
# variable HF_DATASET (dataset repo id, e.g. <hf-user>/circeo-meteo). Incremental, daily.
name: mirror-hf
on:
  schedule: [{cron: '13 2 * * *'}]
  workflow_dispatch:
    inputs:
      release: {description: 'only this Release tag (empty = all)', default: ''}
permissions:
  contents: read
concurrency: {group: mirror-hf, cancel-in-progress: false}
jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      GH_TOKEN: ${{ github.token }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_HUB_ENABLE_HF_TRANSFER: '1'
    steps:
      - name: configured?
        id: c
        run: |
          if [ -z "$HF_TOKEN" ] || [ -z "${{ vars.HF_DATASET }}" ]; then echo "HF_TOKEN secret or HF_DATASET variable missing: nothing to do"; echo "skip=1" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v4
        if: steps.c.outputs.skip != '1'
        with: {repository: boris-circeo/circeo-meteo}
      - uses: actions/setup-python@v5
        if: steps.c.outputs.skip != '1'
        with: {python-version: '3.12'}
      - if: steps.c.outputs.skip != '1'
        run: pip install "huggingface_hub[hf_transfer]>=0.26"
      - if: steps.c.outputs.skip != '1'
        run: |
          python -m meteo.mirror_hf --github ${{ github.repository }} --hf ${{ vars.HF_DATASET }} ${{ inputs.release && format('--release {0}', inputs.release) || '' }}
